# =============================================================================
# CacheHunter — config.conf
# Default configuration. Values here are overridden by CLI flags when passed.
# =============================================================================

# --- Traffic / rate control -------------------------------------------------
CONCURRENCY=5              # parallel workers (xargs -P). Keep conservative.
REQUEST_DELAY=0.5          # seconds between requests issued by a single worker
TIMEOUT=10                 # curl per-request timeout (seconds)
RETRIES=2                  # curl retry count on transient failure
USER_AGENT="CacheHunter/1.0 (+authorized-security-testing)"

# --- Discovery toggles (can be overridden with --skip-* flags) -------------
USE_KATANA=true
USE_GAU=true
USE_WAYBACK=true
USE_NUCLEI=true
USE_WCVS=true
USE_PARAMMINER=true

# --- Param Miner integration -------------------------------------------------
# Param Miner is a Burp Suite extension, not a CLI tool. If your environment
# exposes a real CLI/headless integration for it, point to it here and
# paramminer.sh will call it. Otherwise leave blank — cachehunter will only
# prepare a ranked target list for manual import into Burp.
PARAMMINER_CLI=""

# --- WCVS ---------------------------------------------------------------
WCVS_BIN="wcvs"

# --- Nuclei ---------------------------------------------------------------
NUCLEI_BIN="nuclei"
# Optional built-in template directory scanned when no -t template is given.
# Not guaranteed to contain cache-poisoning-specific checks — verify yourself.
DEFAULT_NUCLEI_TEMPLATES="nuclei-templates/"

# --- Safety -----------------------------------------------------------------
# Marker prefix used for harmless cache-poisoning probes. A random suffix is
# appended per-run so markers never collide across scans or targets.
MARKER_PREFIX="CACHEHUNTER"

# --- Output -----------------------------------------------------------------
OUTPUT_DIR="output"
LOG_DIR="logs"
